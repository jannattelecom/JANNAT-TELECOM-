<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title><style>body{font-family:sans-serif;background:#f2f2f2;padding:15px}.box{background:#fff;padding:15px;border-radius:12px;max-width:450px;margin:auto}input,select{width:100%;padding:10px;margin:7px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#e91e63;color:#fff;border:none;border-radius:8px;font-size:16px}</style></head><body><div class="box"><h2>অটো Admin - প্যাকেজ অ্যাড</h2><input id="token" placeholder="GitHub Token এখানে বসান" type="password"><select id="sim"><option>Grameenphone</option><option>Robi</option><option>Airtel</option><option>Banglalink</option><option>Teletalk</option></select><input id="name" placeholder="প্যাকেজের নাম - 30GB 30 দিন"><input id="price" placeholder="দাম - 399"><input id="oldPrice" placeholder="আগের দাম - 499"><button onclick="addPkg()">+ প্যাকেজ যোগ করুন ✅</button><p id="msg"></p><div id="list"></div></div><script>
const owner="jannattelecom",repo="JANNAT-TELECOM-",path="packages.json";
let pkgs=[];let sha="";
document.getElementById('token').value=localStorage.getItem('gh_token')||'';
function b64Encode(str){let bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);}
async function load(){let r1=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);let j=await r1.json();sha=j.sha;let r2=await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/${path}?t=`+Date.now());pkgs=await r2.json();show();}
function show(){document.getElementById('list').innerHTML=pkgs.map((p,i)=>{let sim=p.sim||p.operator||'Jannat Telecom';let name=p.name||p.packageName||'';return `<div style="background:#f9f9f9;padding:10px;margin-top:8px;border-radius:8px;display:flex;justify-content:space-between"><span><b>${sim}</b><br>${name}<br><b>${p.price} ৳</b> ${p.oldPrice?`<s>${p.oldPrice}</s>`:''}</span><button onclick="delPkg(${i})" style="width:auto;background:red">Delete</button></div>`}).join('');}
async function save(){let t=document.getElementById('token').value;localStorage.setItem('gh_token',t);document.getElementById('msg').innerText='সেভ হচ্ছে...';let c=b64Encode(JSON.stringify(pkgs,null,2));let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({message:'update package',content:c,sha})});if(r.ok){alert('হয়ে গেছে ✅');load();}else{alert('টোকেন ভুল!');}}
async function addPkg(){if(!name.value||!price.value){alert('নাম আর দাম দেন');return;}pkgs.push({sim:sim.value,name:name.value,price:price.value,oldPrice:oldPrice.value});name.value=price.value=oldPrice.value='';await save();}
async function delPkg(i){pkgs.splice(i,1);await save();}
load();
</script></body></html>
