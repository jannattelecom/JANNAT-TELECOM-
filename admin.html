<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - Jannat Telecom</title><style>body{font-family:sans-serif;background:#f2f2f2;padding:15px;margin:0}.box{background:#fff;padding:20px;border-radius:12px;max-width:450px;margin:auto}h2{font-size:20px;text-align:center}input,select{width:100%;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px}button{width:100%;padding:12px;background:#e91e63;color:#fff;border:none;border-radius:8px;font-size:16px}button.del{background:#ff0000;color:#fff;border:none;border-radius:8px;padding:10px 14px;width:auto}button.logout{background:#333;margin-top:10px}.item{background:#f9f9f9;padding:12px;margin-top:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{padding:4px 10px;border-radius:20px;color:#fff;font-size:12px;font-weight:bold}</style></head><body>
<div class="box" id="loginBox"><h2>🔐 Jannat Telecom<br>Admin Login</h2><p style="text-align:center;color:#666">পাসওয়ার্ড দিয়ে ঢুকুন</p><input id="pass" placeholder="পাসওয়ার্ড লিখুন" type="password"><button onclick="doLogin()">Login ✅</button><p id="loginMsg" style="text-align:center;color:red"></p></div>

<div class="box" id="adminBox" style="display:none"><h2>📱 Jannat Telecom<br>Admin Panel</h2><button class="logout" onclick="doLogout()">Logout</button><input id="token" placeholder="GitHub Token - ১ বার দিলেই হবে" type="password"><select id="sim"><option>Grameenphone</option><option>Robi</option><option>Airtel</option><option>Banglalink</option><option>Teletalk</option></select><input id="name" placeholder="প্যাকেজের নাম"><input id="price" placeholder="দাম"><input id="oldPrice" placeholder="আগের দাম"><button onclick="addPkg()">+ প্যাকেজ যোগ করুন ✅</button><p id="msg" style="text-align:center"></p><h3 id="count"></h3><div id="list"></div></div>
<script>
const MY_PASS="Somrat@890";
const owner="jannattelecom",repo="JANNAT-TELECOM-",path="packages.json";
let pkgs=[],sha=[];
let colors={Grameenphone:'#0078b4',Robi:'#e3000f',Airtel:'#e40000',Banglalink:'#ff6900',Teletalk:'#009444'};
if(localStorage.getItem('admin_login')=='yes'){showAdmin();}
function doLogin(){if(document.getElementById('pass').value==MY_PASS){localStorage.setItem('admin_login','yes');showAdmin();}else{document.getElementById('loginMsg').innerText='পাসওয়ার্ড ভুল!';}}
function doLogout(){localStorage.removeItem('admin_login');location.reload();}
function showAdmin(){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';document.getElementById('token').value=localStorage.getItem('gh_token')||'';load();}
function b64Encode(str){let bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);}
async function load(){let r1=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);let j=await r1.json();sha=j.sha;let r2=await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/${path}?t=`+Date.now());pkgs=await r2.json();show();}
function show(){document.getElementById('count').innerText='মোট প্যাকেজ: '+pkgs.length+' টা';document.getElementById('list').innerHTML=pkgs.map((p,i)=>{let sim=p.sim||p.operator||'Jannat Telecom';let c=colors[sim]||'#999';let name=p.name||p.packageName||'';return `<div class="item"><div><span class="badge" style="background:${c}">${sim}</span><div style="margin-top:6px"><b>${name}</b><br><b>${p.price} ৳</b> ${p.oldPrice?`<s>${p.oldPrice}</s>`:''}</div></div><button class="del" onclick="delPkg(${i})">Delete</button></div>`}).join('');}
async function save(){let t=document.getElementById('token').value;localStorage.setItem('gh_token',t);document.getElementById('msg').innerText='সেভ হচ্ছে...';let c=b64Encode(JSON.stringify(pkgs,null,2));let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({message:'update package',content:c,sha})});if(r.ok){alert('হয়ে গেছে ✅');load();}else{alert('টোকেন ভুল! টোকেনটা আবার বসান');}}
async function addPkg(){if(!name.value||!price.value){alert('নাম আর দাম দেন');return;}pkgs.push({sim:sim.value,name:name.value,price:price.value,oldPrice:oldPrice.value});name.value=price.value=oldPrice.value='';await save();}
async function delPkg(i){if(!confirm('ডিলিট করবেন?'))return;pkgs.splice(i,1);await save();}
</script></body></html>
