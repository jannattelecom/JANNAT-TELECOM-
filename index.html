<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jannat Telecom</title><style>body{font-family:sans-serif;background:#f8f8f8;padding:15px;margin:0}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.tab{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer}.tab.active{background:#e91e63;color:#fff;border-color:#e91e63}.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 5px #ddd}.badge{display:inline-block;padding:5px 12px;border-radius:20px;color:#fff;font-size:13px;font-weight:bold}button.buy{background:#25D366;color:#fff;border:none;padding:11px;border-radius:8px;width:100%;font-size:15px}</style></head><body><h2 style="text-align:center">📱 Jannat Telecom</h2><p style="text-align:center">অপারেটর সিলেক্ট করুন</p><div class="tabs" id="tabs"></div><div id="list">লোড হচ্ছে...</div><script>
let all=[];let cur='সব';
let ops=['সব','Grameenphone','Robi','Airtel','Banglalink','Teletalk'];
let colors={Grameenphone:'#0078b4',Robi:'#e3000f',Airtel:'#e40000',Banglalink:'#ff6900',Teletalk:'#009444'};
let names={Grameenphone:'📶 গ্রামীণফোন',Robi:'📶 রবি',Airtel:'📶 এয়ারটেল',Banglalink:'📶 বাংলালিংক',Teletalk:'📶 টেলিটক'};
function renderTabs(){document.getElementById('tabs').innerHTML=ops.map(o=>`<div class="tab ${o==cur?'active':''}" onclick="setOp('${o}')">${o=='সব'?'সব প্যাকেজ':names[o]||o}</div>`).join('');}
function setOp(o){cur=o;renderTabs();render();}
function render(){let list=cur=='সব'?all:all.filter(p=>(p.sim||'')==cur);if(!list.length){document.getElementById('list').innerHTML='<p style="text-align:center">এই অপারেটরের কোনো প্যাকেজ নাই</p>';return;}document.getElementById('list').innerHTML=list.map(p=>{let sim=p.sim||'Jannat Telecom';let c=colors[sim]||'#e91e63';let nm=names[sim]||sim;return `<div class="card"><span class="badge" style="background:${c}">${nm}</span><h3 style="margin:10px 0">${p.name}</h3><p><b>${p.price} ৳</b> ${p.oldPrice?`<s>${p.oldPrice} ৳</s>`:''}</p><button class="buy" onclick="window.open('https://wa.me/971XXXXXXXXX?text='+encodeURIComponent('আমি '+sim+' এর '+p.name+' প্যাকেজটি নিতে চাই'))">WhatsApp এ অর্ডার করুন</button></div>`}).join('');}
async function load(){let r=await fetch('https://cdn.jsdelivr.net/gh/jannattelecom/JANNAT-TELECOM-@main/packages.json?t='+Date.now());all=await r.json();renderTabs();render();}
load();
</script></body></html>
