<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jannat Telecom</title><style>body{font-family:sans-serif;background:#f8f8f8;padding:15px}.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 5px #ddd}button{background:#25D366;color:#fff;border:none;padding:10px;border-radius:8px;width:100%}</style></head><body><h2 style="text-align:center">📱 Jannat Telecom</h2><p style="text-align:center">সব প্যাকেজ - অটো আপডেট</p><div id="list">লোড হচ্ছে...</div><script>
async function load(){let r=await fetch('https://cdn.jsdelivr.net/gh/jannattelecom/JANNAT-TELECOM-@main/packages.json?t='+Date.now());let pkgs=await r.json();document.getElementById('list').innerHTML=pkgs.map(p=>`<div class="card"><b>${p.sim}</b><h3>${p.name}</h3><p><b>${p.price} ৳</b> <s>${p.oldPrice} ৳</s></p><button onclick="window.open('https://wa.me/971XXXXXXXXX?text='+encodeURIComponent('আমি '+p.name+' প্যাকেজটি নিতে চাই'))">WhatsApp এ অর্ডার করুন</button></div>`).join('');}
load();
</script></body></html>
